[package]
name = "studio-dsp"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "aiff", "alac", "caf", "flac", "isomp4", "mp2", "mp3", "ogg", "pcm", "vorbis", "wav", "all-meta"] }
rubato = { version = "5.0.1", default-features = false, features = ["fft_resampler"] }
sha2 = { version = "0.11.1", default-features = false }
md-5 = { version = "0.11.0", default-features = false }
realfft = "3.5.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
